[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-network-discovery-toolkit"
version = "0.1.0"
description = "CLI toolkit for pre-deployment IP camera network discovery, RTSP health checks, and network readiness surveys."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emmanuel Oyekanlu" }]
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "opencv-python-headless>=4.8",
    "click>=8.1",
]

[project.scripts]
camtoolkit = "camtoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
